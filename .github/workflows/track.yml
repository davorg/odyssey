name: Track Villa Vie Odyssey

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odyssey-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install websockets

      - name: Record current position
        env:
          AIS_MMSI: 311541000
          AIS_TIMEOUT: 900
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python scripts/record_position.py --verbose

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/odyssey.sqlite

          if ! git diff --cached --quiet; then
            git commit -m "Record Odyssey position"
            git push
          fi
