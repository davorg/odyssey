name: Track Villa Vie Odyssey

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odyssey-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up perl
        uses: shogo82148/actions-setup-perl@v1.43.1
        with:
          perl-version: 5.42

      - name: Install Perl dependencies
        run: cpanm --notest DBI DBD::SQLite

      - name: Record current position
        env:
          VESSEL_API_KEY: ${{ secrets.VESSEL_API_KEY }}
          AIS_MMSI: 311541000
        run: perl scripts/record_position.pl --verbose

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Record Odyssey position"
            git push
          fi

